name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  hmod:
    # Keep in sync with the vendor/hmod-build submodule tag.
    uses: DefKorns/hmod-build/.github/workflows/hmod.yml@v1.4.0
    with:
      release-name: Gamepad Remapping Tool
      docker: true
    secrets: inherit
    permissions:
      contents: write
